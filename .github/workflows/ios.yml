name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - "kmp/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "kmp/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS Kotlin targets
        working-directory: kmp
        shell: bash
        run: |
          ./gradlew :server:compileKotlinIosSimulatorArm64 :app:shared:compileKotlinIosSimulatorArm64 :app:shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace --console=plain > /tmp/gradle-ios.log 2>&1 || {
            wc -c /tmp/gradle-ios.log 2>&1 | sed 's/^/::error::/' || true
            grep -n -A14 -E '^e: ' /tmp/gradle-ios.log | tail -100 | sed 's/^/::error::/' || true
            grep -n -B4 -A20 -E 'KMP Dependencies|Compilation finished|What went wrong|FAILURE:' /tmp/gradle-ios.log | tail -120 | sed 's/^/::error::/' || true
            tail -80 /tmp/gradle-ios.log | sed 's/^/::error::tail /' || true
            exit 1
          }
