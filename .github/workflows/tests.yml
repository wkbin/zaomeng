name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run development checks
        env:
          TMPDIR: ${{ runner.temp }}/zaomeng-tests
          TEMP: ${{ runner.temp }}/zaomeng-tests
          TMP: ${{ runner.temp }}/zaomeng-tests
        run: python scripts/dev_checks.py
