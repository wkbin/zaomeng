# 卡片生成 user 提示词（迁移自 Ktor CardsService / Python review/scene_cards.py、
# review/self_cards.py 的硬编码 instruction；{field_lines} 由代码按字段清单生成）

scene_card:
  instruction: |
    请随机生成一张完整的原创场景卡。
    要求：
    1. 要能直接拿来开启一段人物互动，而不是世界观设定条目。
    2. 地点、气氛、开场局面要具体，让人一看就知道从哪一拍开始。
    3. 场景推进方向要明确，能自然推动剧情往前。
    4. 列表型字段请用全角分号“；”分隔。
    5. 所有字段都要填写；没有特别禁忌时，也请给自然简短的内容。

    字段清单：
    {field_lines}

    返回格式示例：{"title":"...","location":"..."}

self_card:
  instruction: |
    请随机生成一张完整的原创角色卡。
    要求：
    1. 这是用于“以自己入场”的角色卡，所以要有明确称呼、入场身份、互动气氛。
    2. 关键字段必须具体，避免空泛词。
    3. 列表型字段请用全角分号“；”分隔。
    4. 所有字段都要填写；实在不需要的细字段也请给一句简短但自然的内容。
    5. 保持前后一致，语气偏小说角色设定，而不是现实简历。

    字段清单：
    {field_lines}

    返回格式示例：{"display_name":"...","scene_identity":"..."}
